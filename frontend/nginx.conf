# Upstream is re-resolved via Docker DNS, so `docker compose --scale backend=N`
# spreads requests across all backend replicas.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 32k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        # Server-Sent Events: keep the connection open and unbuffered.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # NB: no add_header inside locations — that would drop the security
    # headers above (nginx doesn't merge add_header across levels). Caching is
    # set with `expires` instead.

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback so client-side routes (/chat, /admin) resolve to index.html.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
