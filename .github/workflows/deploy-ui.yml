name: Deploy UI (Cloudflare)

# Deploys frontend/ as a static-assets Worker on every push to main that touches
# it. Inert until the CLOUDFLARE_ACCOUNT_ID variable exists (see docs/DEPLOY.md).
# Needs the CLOUDFLARE_API_TOKEN secret ("Edit Cloudflare Workers" template) and
# DEMO_API_URL (the Cloud Run backend) as a variable.
on:
  push:
    branches: [main]
    paths: [frontend/**, .github/workflows/deploy-ui.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ui
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: demo-ui
      url: ${{ vars.DEMO_APP_URL }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.DEMO_API_URL }}
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy
