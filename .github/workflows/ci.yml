name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests (SQLite + fakeredis)
        run: pytest -q
      - name: Integration tests (Postgres + Redis)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          TEST_REDIS_URL: redis://localhost:6379/1
        run: pytest -q
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
        run: |
          psql postgresql://postgres:postgres@localhost:5432/test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize + kubeconform
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" | tar xz
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
      - name: Validate overlays
        run: |
          for o in deploy/k8s/overlays/dev deploy/k8s/overlays/prod deploy/k8s/loadtest; do
            echo "== $o"
            ./kustomize build "$o" | ./kubeconform -strict -summary -kubernetes-version 1.30.0 -
          done

  loadtest-smoke:
    # Short distributed-style smoke run against the real stack (fake LLM):
    # fails on SLO breaches or any correctness invariant violation.
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      ENV: dev
      AUTH_MODE: dev
      LLM_PROVIDER: fake
      FAKE_LLM_LATENCY_MS: "1000"
      FAKE_LLM_ERROR_RATE: "0.005"
      MAX_CONCURRENT_TURNS: "2000"
      LOG_LEVEL: WARNING
      LT_CUSTOMERS: "2000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            loadtest/requirements.txt
      - run: pip install -r backend/requirements.txt -r loadtest/requirements.txt
      - name: Migrate + seed
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.db.seed
          python -m scripts.seed_synthetic --customers 2000
      - name: Start backend (2 workers)
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --port 8000 --workers 2 --no-access-log > ../backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health/ready && break; sleep 1; done
      - name: Locust smoke (SLO-gated)
        working-directory: loadtest
        env:
          LOAD_SHAPE: smoke
        run: |
          mkdir -p results
          locust -f locustfile.py --host http://localhost:8000 --headless \
            --csv results/smoke --html results/smoke.html --only-summary
      - name: Correctness invariants
        working-directory: loadtest
        run: python check_invariants.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-smoke
          path: |
            loadtest/results/
            backend.log

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend, k8s-manifests]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: backend, context: backend }
          - { name: frontend, context: frontend }
          - { name: loadtest, context: loadtest }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/likhithv02/customer-support-agent-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/likhithv02/customer-support-agent-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
