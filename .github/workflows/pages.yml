name: Deploy landing page (GitHub Pages)

# One-time setup: Settings → Pages → Source: "GitHub Actions". Set the
# repository variables DEMO_APP_URL (the Vercel UI) and DEMO_API_URL (the
# Cloud Run backend) so the page links to and pre-warms the live demo.
on:
  push:
    branches: [main]
    paths: [landing/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_APP_URL: ${{ vars.DEMO_APP_URL }}
          VITE_API_BASE_URL: ${{ vars.DEMO_API_URL }}
          LANDING_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
