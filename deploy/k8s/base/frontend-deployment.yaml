apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-frontend
  labels:
    app.kubernetes.io/name: acme-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: acme-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acme-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: acme-frontend
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
