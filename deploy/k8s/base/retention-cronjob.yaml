apiVersion: batch/v1
kind: CronJob
metadata:
  name: acme-retention
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: acme-retention
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              image: acme-backend
              command: ["python", "-m", "app.maintenance.retention"]
              envFrom:
                - configMapRef:
                    name: acme-backend-config
                - secretRef:
                    name: acme-backend-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 256Mi }
