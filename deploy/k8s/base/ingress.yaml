# ingress-nginx. /api goes straight to the backend (SSE-safe settings);
# everything else is the static SPA. ingress-nginx already generates and
# forwards X-Request-ID, which the backend logs and echoes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acme-support
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 32k
spec:
  ingressClassName: nginx
  rules:
    - host: support.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: acme-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: acme-frontend
                port:
                  name: http
