# EXAMPLE ONLY — not referenced by kustomization.yaml. Create the real Secret
# out-of-band (External Secrets Operator, Sealed Secrets, or
# `kubectl create secret generic acme-backend-secrets --from-env-file=...`).
apiVersion: v1
kind: Secret
metadata:
  name: acme-backend-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://USER:PASSWORD@HOST:5432/acme
  REDIS_URL: rediss://:PASSWORD@HOST:6379/0
  # Either a shared HS256 secret (≥32 random bytes) or your IdP's JWKS URL.
  JWT_SECRET: ""
  JWT_JWKS_URL: ""
  JWT_ISSUER: ""
  JWT_AUDIENCE: ""
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  SENTRY_DSN: ""
