# Runs `alembic upgrade head` on every deploy, before the new revision takes
# traffic (the advisory lock in alembic/env.py makes concurrent runs safe).
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ${SERVICE}-migrate
spec:
  template:
    spec:
      taskCount: 1
      template:
        spec:
          serviceAccountName: ${RUNTIME_SA}
          maxRetries: 1
          timeoutSeconds: 600
          containers:
            - image: ${IMAGE}
              command: ["alembic", "upgrade", "head"]
              env:
                - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: acme-database-url, key: latest } } }
